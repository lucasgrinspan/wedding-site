<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.journeyTitle">Our Journey - Lianne & Lucas</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="logo-container">
      <a href="/" class="logo">Lianne & Lucas</a>
    </div>
  </header>

  <main class="journey-container">
    <div id="timeline" class="timeline-sidebar">
      <h2 data-i18n="journey.timeline">Timeline</h2>
      <!-- Timeline items will be injected here -->
      <ul id="timeline-list"></ul>
    </div>

    <div id="map-container">
      <div id="map"></div>

      <!-- Info Card Overlay -->
      <div id="info-card" class="info-card hidden">
        <button id="close-card" class="close-btn">&times;</button>
        <div class="info-card-scroll-container">
          <img id="card-image" src="" data-i18n-alt="journey.photoAlt" alt="Location Photo">
          <div class="card-content">
            <h3 id="card-title">Title</h3>
            <p id="card-date">Date</p>
            <p id="card-caption">Caption goes here...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2027 Lianne & Lucas <a href="/journey.html" class="signature-mango">🥭</a></p>
  </footer>

  <script type="module" src="/src/journey.ts"></script>
</body>

</html>
