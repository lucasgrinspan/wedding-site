<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP - Lucas & Lianne's Wedding</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <header class="centered-header">
    <a href="/" class="logo" style="text-decoration: none;">Lucas & Lianne</a>
  </header>

  <main>
    <section class="details-editorial-container" style="padding-top: 120px;">
      <div class="editorial-header">
        <span class="editorial-subtitle">Response</span>
        <h2 class="editorial-title">Kindly Reply</h2>
        <div class="editorial-divider"></div>
        <p style="margin-top: 1.5rem; font-family: var(--font-editorial); font-size: 1.15rem; color: #4A5650; max-width: 500px;">Please let us know if you can celebrate with us by December 1, 2026.</p>
      </div>

      <div class="stationery-card" style="max-width: 600px; margin: 0 auto; text-align: left;">
        <form class="stationery-form" action="https://formspree.io/f/mojndlqj" method="POST">
          <input type="hidden" name="_next" value="/thanks.html">

          <div class="form-group">
            <label for="names">Guest Name(s)</label>
            <input type="text" id="names" name="names" placeholder="e.g. Lucas Grinspan & Lianne D'Arcy" required>
            <small style="font-family: var(--font-body); font-size: 0.8rem; color: #5A6A62; margin-top: 0.4rem;">Please include first and last names of all guests in your party.</small>
          </div>

          <div class="form-group">
            <label>Will you be attending?</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="attending" value="yes" required>
                <span>Joyfully Accept</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="attending" value="no">
                <span>Regretfully Decline</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="guests">Number of Guests</label>
            <select id="guests" name="guest_count" required>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>

          <div class="form-group">
            <label for="dietary">Dietary Restrictions Or Song Requests</label>
            <textarea id="dietary" name="message" rows="4" placeholder="Vegetarian, allergies, etc."></textarea>
          </div>

          <div style="text-align: center; margin-top: 3rem;">
            <button type="submit" class="btn btn-dark-green">Submit RSVP</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div class="editorial-closing-simple">
    <p class="closing-signature">Love, Lianne & Lucas <a href="/journey.html" class="signature-mango">🥭</a></p>
  </div>

</body>

</html>
