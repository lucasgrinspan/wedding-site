<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucas & Lianne's Wedding</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <main>
    <section class="hero-section">
      <div class="mobile-top-bar">
        <h1 class="wedding-names">Lianne & Lucas</h1>
      </div>
      <div class="hero-image-container">
        <picture class="hero-picture">
          <source srcset="/hero.JPG" media="(max-width: 767px)" />
          <img src="/hero-wide.png" alt="Lucas & Lianne" class="hero-image" />
        </picture>
      </div>
      <div class="hero-gradient-overlay"></div>
      <div class="hero-layout-container">
        <div class="hero-content-wrapper">
          <div class="hero-content">
            <h1 class="wedding-names">Lianne & Lucas</h1>
            <div class="mobile-only-header">
              <h2 class="mobile-getting-married">We're Getting Married!</h2>
            </div>
            <div class="wedding-meta">
              <p class="wedding-date-location">FEBRUARY 20, 2027 &bull; MIAMI, FL</p>
              <p class="wedding-countdown" id="countdown-wrapper"><span id="countdown">--- DAYS TO GO!</span></p>
            </div>
            <div class="hero-cta-container">
              <a href="#details" class="btn btn-hero">Details</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="details" class="details-editorial-container">
      <div class="editorial-header desktop-only-header">
        <h2 class="editorial-title">We're Getting Married!</h2>
        <div class="editorial-divider"></div>
      </div>

      <div class="editorial-grid">
        <div class="editorial-item">
          <!-- <span class="editorial-num">I</span> -->
          <h3>When</h3>
          <p class="editorial-main-detail">February 20, 2027</p>
        </div>

        <div class="editorial-item">
          <!-- <span class="editorial-num">II</span> -->
          <h3>Where</h3>
          <p class="editorial-main-detail">Deering Estate</p>
          <p class="editorial-sub-detail">16701 SW 72nd Ave, Miami, FL 33157</p>
        </div>
      </div>
    </section>

    <section class="editorial-closing">
      <div class="editorial-divider" style="margin-bottom: 3rem;"></div>
      <h2 class="closing-headline">We can't wait to celebrate with you!</h2>
      <p class="closing-signature">Love, Lianne & Lucas <a href="/journey.html" class="signature-mango">🥭</a></p>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
