<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.thanksTitle">Thank You - Lianne & Lucas's Wedding</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <header class="centered-header">
    <a href="/" class="logo">Lianne & Lucas</a>
  </header>

  <main>
    <section class="container">
      <h1 class="editorial-title" data-i18n="thanks.title">Thanks!</h1>
      <p class="thanks-received" data-i18n="thanks.received">We got your RSVP.</p>
      <p id="thanks-celebrate-msg" data-i18n="thanks.celebrate">We can't wait to celebrate with you!</p>

      <!-- Optional personal note from Lianne & Lucas (populated dynamically if configured for guest/party) -->
      <div id="thanks-delight-note" class="delight-note-callout delight-note-callout-centered" style="display: none;">
        <span class="delight-note-eyebrow" data-i18n="thanks.personalNoteLabel">A Personal Note from Lianne &amp; Lucas</span>
        <p id="thanks-delight-note-text" class="delight-note-body"></p>
      </div>

      <p class="form-note thanks-note" data-i18n="thanks.updateNote">Need to make a change later? You can return to the <a href="/rsvp.html">RSVP page</a> through December 31, 2026 to submit an updated response for your party.</p>

      <div>
        <a href="/" class="btn" data-i18n="thanks.backHome">Back to Home</a>
      </div>
    </section>
  </main>

  <footer class="editorial-closing-simple">
    <p class="closing-signature" data-i18n="closing.signature">Love, Lianne & Lucas <a href="/journey.html" class="signature-mango">🥭</a></p>
  </footer>

  <script type="module" src="/src/thanks.ts"></script>
</body>

</html>
